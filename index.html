<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>egui GUI Test</title>

    <!-- Tells Trunk to build this crate to wasm and inject the loader script. -->
    <link data-trunk rel="rust" data-wasm-opt="2" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
        }
        /* egui sizes itself to fill this canvas. */
        #the_canvas_id {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font: 20px sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <p id="loading_text">Loading…</p>
</body>
</html>
