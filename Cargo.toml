[package]
name = "gui_test"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/model"]

[dependencies]
websim-model = { path = "crates/model" }
eframe = "0.36"
egui_plot = "0.37.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Element", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17.2"
